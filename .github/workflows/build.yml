name: Build
# Tests the core against the test corpus and bundles the MSI. Every push to main publishes
# a release versioned 0.<phase>.<n> (see tools/version.mjs); pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch test corpus
        uses: actions/checkout@v4
        with:
          repository: jindrapetrik/jpexs-decompiler
          path: corpus
          sparse-checkout: libsrc/ffdec_lib/testdata

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Version
        id: version
        run: node tools/version.mjs > version.conf.json

      - name: Test
        run: cargo test --release -p lumen

      - name: Bundle MSI
        run: npx tauri build --bundles msi --config version.conf.json

      - name: Build CLI
        run: cargo build --release -p lumen-cli
        env:
          LUMEN_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-swf-${{ steps.version.outputs.version }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/lumen-swf-cli.exe
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lumen-SWF ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/lumen-swf-cli.exe
