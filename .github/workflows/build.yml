name: Build
# Bundles the MSI and the CLI in parallel; tests run locally before pushing. Every push to main publishes
# a release versioned 0.<phase>.<n> (see tools/version.mjs); pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: node tools/version.mjs

  msi:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: msi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Bundle MSI
        run: |
          node -e "require('fs').writeFileSync('version.conf.json', JSON.stringify({ version: '${{ needs.version.outputs.version }}' }))"
          npx tauri build --bundles msi --config version.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

  cli:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli

      - name: Build CLI
        run: cargo build --release -p lumen-cli
        env:
          LUMEN_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: target/release/lumen-swf-cli.exe
          if-no-files-found: error

  publish:
    needs: [version, msi, cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lumen-SWF ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.msi
            dist/lumen-swf-cli.exe
