<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust-FFDec</title>
    <link rel="stylesheet" href="app.css">
    <script defer src="app.js"></script>
</head>
<body>
<header class="toolbar">
    <div class="brand">Rust-FFDec</div>
    <button id="btn-open" class="btn primary" title="Open SWF (Ctrl+O)">Open…</button>
    <div class="menu-wrap">
        <button id="btn-save" class="btn" disabled title="Save a copy with chosen compression (Ctrl+S)">Save as…</button>
        <div id="save-menu" class="menu" hidden>
            <div class="menu-title">Compression</div>
            <label><input type="radio" name="comp" value="none"> Uncompressed (FWS)</label>
            <label><input type="radio" name="comp" value="zlib" checked> zlib (CWS)</label>
            <label><input type="radio" name="comp" value="lzma"> LZMA (ZWS)</label>
            <label><input type="radio" name="comp" value="abc"> LZMA, ABC container</label>
            <div class="menu-sep"></div>
            <label><input type="checkbox" id="opt-encrypt"> Harman AIR encryption</label>
            <button id="btn-save-go" class="btn primary block">Save…</button>
        </div>
    </div>
    <button id="btn-export" class="btn" disabled title="Export the selected asset (images, sounds, fonts…), or the raw tag body">Export…</button>
    <button id="btn-raw" class="btn" disabled title="Save the selected tag's raw body">Raw…</button>
    <div class="menu-wrap">
        <button id="btn-export-all" class="btn" disabled title="Export every asset of the chosen types into a folder">Export all…</button>
        <div id="export-menu" class="menu" hidden>
            <div class="menu-title">Asset types</div>
            <label><input type="checkbox" name="kind" value="images" checked> Images</label>
            <label><input type="checkbox" name="kind" value="sounds" checked> Sounds</label>
            <label><input type="checkbox" name="kind" value="fonts" checked> Fonts</label>
            <label><input type="checkbox" name="kind" value="texts" checked> Texts</label>
            <label><input type="checkbox" name="kind" value="binaryData" checked> Binary data</label>
            <label><input type="checkbox" name="kind" value="movies" checked> Movies</label>
            <label><input type="checkbox" name="kind" value="shapes" checked> Shapes</label>
            <label><input type="checkbox" name="kind" value="morphshapes" checked> Morph shapes</label>
            <label><input type="checkbox" name="kind" value="sprites"> Sprites (every frame)</label>
            <label><input type="checkbox" name="kind" value="buttons"> Buttons</label>
            <label><input type="checkbox" name="kind" value="frames"> Frames</label>
            <div class="menu-sep"></div>
            <div class="menu-title">Formats</div>
            <label><input type="checkbox" id="opt-png"> Images as PNG only</label>
            <label><input type="checkbox" id="opt-wav"> Sounds as WAV only</label>
            <label><input type="checkbox" id="opt-shapes-png"> Shapes as PNG (default SVG)</label>
            <label><input type="checkbox" id="opt-frames-svg"> Frames, sprites, buttons as SVG (default PNG)</label>
            <label><input type="checkbox" id="opt-texts-svg"> Texts as SVG (default plain text)</label>
            <label><input type="checkbox" id="opt-pcode"> Scripts as P-code (default ActionScript)</label>
            <label class="zoom">PNG scale <input type="number" id="opt-zoom" min="0.1" max="16" step="0.5" value="1"></label>
            <button id="btn-export-go" class="btn primary block">Choose folder…</button>
        </div>
    </div>
    <button id="btn-close" class="btn" disabled title="Close the selected file">Close</button>
    <div class="spacer"></div>
    <div class="seg" role="tablist" aria-label="Tree view">
        <button id="view-res" class="seg-btn active" role="tab">Resources</button>
        <button id="view-tags" class="seg-btn" role="tab">Tag list</button>
    </div>
</header>

<main class="workspace">
    <aside class="sidebar" id="sidebar">
        <div class="filter"><input id="filter" type="search" placeholder="Filter tree" spellcheck="false"></div>
        <div id="tree" class="tree" tabindex="0" role="tree"></div>
    </aside>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
    <section class="panel">
        <div id="empty" class="empty">
            <div class="empty-mark">SWF</div>
            <h1>Open a Flash file</h1>
            <p>Drop a <code>.swf</code> here or choose one. Files open read-only; saving always writes a copy.</p>
            <button id="btn-open-empty" class="btn primary">Open…</button>
        </div>
        <div id="content" class="content" hidden>
            <div class="panel-head">
                <h2 id="sel-title"></h2>
                <div class="tabs" role="tablist">
                    <button class="tab" data-tab="preview" role="tab" hidden>Preview</button>
                    <button class="tab active" data-tab="details" role="tab">Details</button>
                    <button class="tab" data-tab="hex" role="tab">Hex</button>
                </div>
            </div>
            <div id="tab-preview" class="tab-body preview-body" hidden>
                <div id="preview"></div>
                <p id="preview-note" class="preview-note"></p>
            </div>
            <div id="tab-details" class="tab-body">
                <table class="fields"><tbody id="fields"></tbody></table>
            </div>
            <div id="tab-hex" class="tab-body hex-body" hidden>
                <div id="hex" class="hex"><div id="hex-spacer"></div><div id="hex-rows" class="hex-rows"></div></div>
            </div>
        </div>
    </section>
</main>

<footer class="status"><span id="status">Ready</span></footer>
<div id="drop" class="drop" hidden><div>Drop to open</div></div>
</body>
</html>
