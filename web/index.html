<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen-SWF</title>
    <link rel="stylesheet" href="app.css">
    <script defer src="app.js"></script>
</head>
<body>
<header class="toolbar">
    <div class="brand">Lumen-SWF</div>
    <button id="btn-open" class="btn primary" title="Open SWF (Ctrl+O)">Open…</button>
    <button id="btn-save" class="btn" disabled title="Save changes to the file (Ctrl+S)">Save</button>
    <div class="menu-wrap">
        <button id="btn-save-as" class="btn" disabled title="Save under a new name, with a chosen compression (Ctrl+Shift+S)">Save as…</button>
        <div id="save-menu" class="menu" hidden>
            <div class="menu-title">Compression</div>
            <label><input type="radio" name="comp" value="none"> Uncompressed (FWS)</label>
            <label><input type="radio" name="comp" value="zlib" checked> zlib (CWS)</label>
            <label><input type="radio" name="comp" value="lzma"> LZMA (ZWS)</label>
            <label><input type="radio" name="comp" value="abc"> LZMA, ABC container</label>
            <div class="menu-sep"></div>
            <label><input type="checkbox" id="opt-encrypt"> Harman AIR encryption</label>
            <button id="btn-save-go" class="btn primary block">Save…</button>
        </div>
    </div>
    <button id="btn-export" class="btn" disabled title="Export the selected asset (images, sounds, fonts…), or the raw tag body">Export…</button>
    <button id="btn-replace" class="btn" disabled title="Replace the selected image, sound, binary data or edit text with a file">Replace…</button>
    <button id="btn-raw" class="btn" disabled title="Save the selected tag's raw body">Raw…</button>
    <button id="btn-remove" class="btn" disabled title="Remove the selected tag">Remove</button>
    <div class="menu-wrap">
        <button id="btn-export-all" class="btn" disabled title="Export every asset of the chosen types into a folder">Export all…</button>
        <div id="export-menu" class="menu" hidden>
            <div class="menu-title">Asset types</div>
            <label><input type="checkbox" name="kind" value="images" checked> Images</label>
            <label><input type="checkbox" name="kind" value="sounds" checked> Sounds</label>
            <label><input type="checkbox" name="kind" value="fonts" checked> Fonts</label>
            <label><input type="checkbox" name="kind" value="texts" checked> Texts</label>
            <label><input type="checkbox" name="kind" value="binaryData" checked> Binary data</label>
            <label><input type="checkbox" name="kind" value="movies" checked> Movies</label>
            <label><input type="checkbox" name="kind" value="shapes" checked> Shapes</label>
            <label><input type="checkbox" name="kind" value="morphshapes" checked> Morph shapes</label>
            <label><input type="checkbox" name="kind" value="sprites"> Sprites (every frame)</label>
            <label><input type="checkbox" name="kind" value="buttons"> Buttons</label>
            <label><input type="checkbox" name="kind" value="frames"> Frames</label>
            <div class="menu-sep"></div>
            <div class="menu-title">Formats</div>
            <label><input type="checkbox" id="opt-png"> Images as PNG only</label>
            <label><input type="checkbox" id="opt-wav"> Sounds as WAV only</label>
            <label><input type="checkbox" id="opt-shapes-png"> Shapes as PNG (default SVG)</label>
            <label><input type="checkbox" id="opt-frames-svg"> Frames, sprites, buttons as SVG (default PNG)</label>
            <label><input type="checkbox" id="opt-texts-svg"> Texts as SVG (default plain text)</label>
            <label><input type="checkbox" id="opt-pcode"> Scripts as P-code (default ActionScript)</label>
            <label class="zoom">PNG scale <input type="number" id="opt-zoom" min="0.1" max="16" step="0.5" value="1"></label>
            <button id="btn-export-go" class="btn primary block">Choose folder…</button>
            <div class="menu-sep"></div>
            <div class="menu-title">Whole file</div>
            <button class="btn block" data-doc-export="fla" title="A Flash document Adobe Animate opens: library, timelines, tweens and scripts">As FLA…</button>
            <button class="btn block" data-doc-export="xfl" title="The same document as an uncompressed XFL folder">As XFL folder…</button>
            <button class="btn block" data-doc-export="swc" title="An AS3 library for other projects to link against">As SWC…</button>
            <button class="btn block" data-doc-export="iggy" title="A 64-bit Iggy movie for games using the Iggy runtime">As Iggy…</button>
        </div>
    </div>
    <div class="menu-wrap">
        <button id="btn-deob" class="btn" title="Deobfuscation of obfuscated scripts">Deobfuscate…</button>
        <div id="deob-menu" class="menu" hidden>
            <label title="Remove obfuscation traps from scripts before decompiling them; the file is not changed"><input type="checkbox" id="opt-auto-deob"> Automatic deobfuscation</label>
            <div class="menu-sep"></div>
            <div class="menu-title">Rewrite AS3 code</div>
            <button class="btn block" data-deob="traps" title="Remove obfuscation traps from every AS3 method of the file">Remove traps</button>
            <button class="btn block" data-deob="deadcode" title="Remove unreachable code from every AS3 method of the file">Remove dead code</button>
            <button class="btn block" data-deob="groupparts" title="Move blocks reached by a single jump to where they are jumped to, in every AS3 method">Group code blocks</button>
        </div>
    </div>
    <button id="btn-close" class="btn" disabled title="Close the selected file">Close</button>
    <div class="spacer"></div>
    <button id="btn-discord" class="btn icon-text" title="Join the Foxhearth Discord server"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.1-.8-9.6-3.6-13.6ZM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>Discord</button>
    <div class="menu-wrap">
        <button id="btn-support" class="btn icon-text support" title="Support the project"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21Z"/></svg>Support</button>
        <div id="support-menu" class="menu right" hidden>
            <div class="menu-title">Support the project</div>
            <button class="btn block" data-link="kofi">Ko-fi</button>
            <button class="btn block" data-link="paypal">PayPal</button>
        </div>
    </div>
    <div class="seg" role="tablist" aria-label="Tree view">
        <button id="view-res" class="seg-btn active" role="tab">Resources</button>
        <button id="view-tags" class="seg-btn" role="tab">Tag list</button>
    </div>
</header>

<main class="workspace">
    <aside class="sidebar" id="sidebar">
        <div class="filter">
            <input id="filter" type="search" placeholder="Filter tree" spellcheck="false">
            <button id="btn-find" class="btn" disabled title="Search scripts and texts (Ctrl+Shift+F)">Search</button>
        </div>
        <form id="find" class="find" hidden>
            <input id="find-text" type="search" placeholder="Search scripts and texts" spellcheck="false">
            <div class="find-opts">
                <select id="find-in" aria-label="Search in"><option value="scripts">ActionScript</option><option value="pcode">P-code</option><option value="texts">Texts</option></select>
                <label><input type="checkbox" id="find-case"> Match case</label>
                <label><input type="checkbox" id="find-regex"> Regex</label>
                <label><input type="checkbox" id="find-all"> All files</label>
            </div>
            <ul id="find-results" class="find-results"></ul>
        </form>
        <div id="tree" class="tree" tabindex="0" role="tree"></div>
    </aside>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
    <section class="panel">
        <div id="empty" class="empty">
            <div class="empty-mark">SWF</div>
            <h1>Open a Flash file</h1>
            <p>Drop a <code>.swf</code>, <code>.swc</code>, <code>.zip</code> or <code>.sol</code> here or choose one. Changes stay in memory until you save.</p>
            <button id="btn-open-empty" class="btn primary">Open…</button>
        </div>
        <div id="content" class="content" hidden>
            <div class="panel-head">
                <h2 id="sel-title"></h2>
                <div class="tabs" role="tablist">
                    <button class="tab" data-tab="preview" role="tab" hidden>Preview</button>
                    <button class="tab active" data-tab="details" role="tab">Details</button>
                    <button class="tab" data-tab="hex" role="tab">Hex</button>
                    <button class="tab" data-tab="play" role="tab" hidden title="Play the file in Ruffle">Play</button>
                </div>
            </div>
            <div id="tab-preview" class="tab-body preview-body" hidden>
                <form id="code-find" class="code-find" hidden>
                    <input id="code-find-text" type="search" placeholder="Find in script" spellcheck="false" aria-label="Find in script">
                    <span id="code-find-count" class="code-find-count"></span>
                    <button type="button" class="btn icon" data-find="prev" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg></button>
                    <button type="submit" class="btn icon" title="Next match (Enter)" aria-label="Next match"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>
                    <label title="Match case"><input type="checkbox" id="code-find-case"> Aa</label>
                    <label title="Regular expression"><input type="checkbox" id="code-find-regex"> .*</label>
                    <button type="button" class="btn" data-find="all" title="Search every script (Ctrl+Shift+F)">All scripts</button>
                    <button type="button" class="btn icon" data-find="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
                </form>
                <div id="preview"></div>
                <p id="preview-note" class="preview-note"></p>
            </div>
            <div id="tab-details" class="tab-body">
                <div id="details-bar" class="code-bar" hidden><button id="btn-edit-header" class="btn" title="Edit the version, frame rate, stage size and background">Edit</button></div>
                <table class="fields"><tbody id="fields"></tbody></table>
            </div>
            <div id="tab-play" class="tab-body play-body" hidden><div id="play" class="play"></div></div>
            <div id="tab-hex" class="tab-body hex-body" hidden>
                <div id="hex" class="hex"><div id="hex-spacer"></div><div id="hex-rows" class="hex-rows"></div></div>
            </div>
        </div>
    </section>
</main>

<footer class="status"><span id="status">Ready</span></footer>
<div id="drop" class="drop" hidden><div>Drop to open</div></div>
</body>
</html>
